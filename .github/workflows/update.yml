# SPDX-License-Identifier: Apache-2.0
#
# Syncs Formula/mcp-re.rb from the newest MCP-RE release: the main repository's formula
# template, rendered with the version and SHA-256 of the release's attested Apple Silicon
# archive. It proves the result installs, upgrades and uninstalls on a clean runner, and
# only then commits it. Uses this repository's own token:
# there is no credential for the main repository, which is public.
name: update

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

env:
  UPSTREAM: syncom-systems/mcp-re
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_FROM_API: "1"

jobs:
  sync:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify the newest release and render the formula
        id: fetch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$(gh release view --repo "$UPSTREAM" --json tagName --jq .tagName)"
          version="${tag#v}"
          archive="mcp-re-${version}-darwin-arm64.tar.gz"
          mkdir dl
          if ! gh release download "$tag" --repo "$UPSTREAM" --dir dl --pattern SHA256SUMS --pattern "$archive" 2>/dev/null \
              || [ ! -f "dl/$archive" ]; then
            echo "release $tag carries no Apple Silicon archive yet; nothing to sync"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh attestation verify "dl/$archive" --repo "$UPSTREAM"
          (cd dl && grep " $archive\$" SHA256SUMS | shasum -a 256 -c -)
          sha="$(awk -v f="$archive" '$2 == f {print $1}' dl/SHA256SUMS)"
          # The template is the main repository's; the version and checksum are the verified release's.
          gh api "repos/$UPSTREAM/contents/packaging/homebrew/mcp-re.rb.in?ref=main" --jq .content | base64 -d > dl/template
          sed -e "s/@VERSION@/${version}/g" -e "s/@SHA256@/${sha}/" dl/template > dl/mcp-re.rb
          if grep -q '@[A-Z_]*@' dl/mcp-re.rb; then echo "unrendered placeholder" >&2; exit 1; fi
          if cmp -s dl/mcp-re.rb Formula/mcp-re.rb 2>/dev/null; then
            echo "Formula/mcp-re.rb already at $tag"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Prove the new formula on a clean runner, including the upgrade
        if: steps.fetch.outputs.changed == 'true'
        run: |
          set -euo pipefail
          version="${{ steps.fetch.outputs.version }}"
          if command -v mcp-re-proxy >/dev/null; then echo "already installed on this runner" >&2; exit 1; fi
          brew tap-new --no-git local/mcp-re
          dir="$(brew --repository local/mcp-re)/Formula"
          if [ -f Formula/mcp-re.rb ]; then
            cp Formula/mcp-re.rb "$dir/mcp-re.rb"
            brew install local/mcp-re/mcp-re
            previous="$(brew list --versions mcp-re | awk '{print $2}')"
            echo "installed previous $previous"
          fi
          cp dl/mcp-re.rb "$dir/mcp-re.rb"
          brew audit --strict --online --formula local/mcp-re/mcp-re
          if [ -n "${previous:-}" ]; then
            brew upgrade local/mcp-re/mcp-re
          else
            brew install local/mcp-re/mcp-re
          fi
          test "$(brew list --versions mcp-re | awk '{print $2}')" = "$version"
          brew test local/mcp-re/mcp-re
          brew uninstall mcp-re
          if command -v mcp-re-proxy >/dev/null; then echo "survived uninstall" >&2; exit 1; fi
          brew untap local/mcp-re

      - name: Commit
        if: steps.fetch.outputs.changed == 'true'
        run: |
          set -euo pipefail
          mkdir -p Formula
          cp dl/mcp-re.rb Formula/mcp-re.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/mcp-re.rb
          git commit -m "mcp-re ${{ steps.fetch.outputs.version }}"
          git push origin HEAD:main

      - name: Install from the published tap
        if: steps.fetch.outputs.changed == 'true'
        run: |
          set -euo pipefail
          version="${{ steps.fetch.outputs.version }}"
          brew tap syncom-systems/mcp-re
          brew install syncom-systems/mcp-re/mcp-re
          test "$(brew list --versions mcp-re | awk '{print $2}')" = "$version"
          brew test syncom-systems/mcp-re/mcp-re
          brew uninstall mcp-re
          brew untap syncom-systems/mcp-re
